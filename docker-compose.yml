services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: openedge-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings
